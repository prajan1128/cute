<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#fff0f7"><title>For my favourite person 🌷</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#593e59;font-family:'DM Sans',sans-serif;overflow-x:hidden;background:radial-gradient(ellipse at 15% 15%,#ffe3ef,transparent 42%),radial-gradient(ellipse at 85% 80%,#e7ddff,transparent 45%),linear-gradient(145deg,#fff6fb,#fff0f7 55%,#f5f0ff)}#stars,.floaties{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.star{position:absolute;width:4px;height:4px;background:#d88bb5;border-radius:50%;opacity:.4;animation:twinkle 3s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.95;transform:scale(1.8)}}main{min-height:100vh;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:26px 15px}.shell{width:min(100%,760px);text-align:center}.topline{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#ad7298;margin-bottom:18px}.card{position:relative;overflow:hidden;border:1px solid #ffffffb8;border-radius:32px;padding:clamp(25px,6vw,58px);background:linear-gradient(145deg,#ffffffc9,#ffffff8a);box-shadow:0 25px 75px #b47da522;backdrop-filter:blur(20px)}.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid #e9c7db;background:#fff9fc;padding:8px 13px;border-radius:99px;color:#a5658a;font-size:12px}.hero{font-size:clamp(62px,15vw,110px);line-height:1.1;margin:24px 0 14px;filter:drop-shadow(0 10px 25px #d68dd733);animation:drift 4s ease-in-out infinite}@keyframes drift{50%{transform:translateY(-8px) rotate(-2deg)}}h1{font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(32px,7vw,56px);line-height:1.14;margin:14px 0;color:#734d70}h1 em{color:#d778a6;font-weight:500}p{color:#8b6787;font-size:clamp(15px,2.8vw,18px);line-height:1.85;max-width:550px;margin:18px auto}.btn{font:600 15px 'DM Sans',sans-serif;border:0;border-radius:99px;padding:14px 23px;cursor:pointer;color:#fff;background:linear-gradient(110deg,#e89abc,#c49ce5);box-shadow:0 8px 28px #d5a5ff25;transition:.25s}.btn:hover{transform:translateY(-2px)}.ghost{color:#a56b91;background:#fff;border:1px solid #e9c7db;box-shadow:none}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}.progress{display:flex;justify-content:center;gap:8px;margin:26px 0 0}.dot{height:6px;width:6px;border-radius:50%;background:#e5c7d9;transition:.3s}.dot.on{width:24px;border-radius:99px;background:#d77eaa}.footer{margin-top:25px;color:#b18aa7;font-size:12px;letter-spacing:1px}.note{margin:25px auto 0;max-width:520px;padding:20px;border:1px solid #ecd1e0;background:#fff9fc;border-radius:22px;color:#896584;line-height:1.9;text-align:left}.note strong{color:#d278a5}.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px auto;max-width:500px}.memory div{padding:17px 10px;border-radius:18px;border:1px solid #ecd1e0;background:#fff9fc;font-size:13px;color:#956d91}.memory span{display:block;font-size:26px;margin-bottom:8px}.spark{position:fixed;pointer-events:none;z-index:5;animation:pop 2.7s ease-out forwards}@keyframes pop{0%{transform:translateY(20px) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
/* extra motion layer */
.card{animation:cardIn .85s cubic-bezier(.2,.8,.2,1) both, cardGlow 7s ease-in-out infinite alternate;}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.975);filter:blur(5px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes cardGlow{to{box-shadow:0 28px 85px #b47da533,0 0 35px #f7c4df20}}
.badge{animation:badgeIn .7s .15s both}@keyframes badgeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
h1{animation:titleIn .8s .18s both}@keyframes titleIn{from{opacity:0;transform:translateY(14px);letter-spacing:2px}to{opacity:1;transform:translateY(0);letter-spacing:normal}}
p{animation:textIn .9s .3s both}@keyframes textIn{from{opacity:0}to{opacity:1}}
.btn{position:relative;overflow:hidden}.btn:after{content:'';position:absolute;top:-60%;left:-70%;width:45%;height:220%;background:linear-gradient(90deg,transparent,#ffffff80,transparent);transform:rotate(25deg);transition:left .65s}.btn:hover:after{left:140%}
.dot{animation:dotPulse 2.4s ease-in-out infinite alternate}@keyframes dotPulse{to{box-shadow:0 0 9px #d77eaa55}}
.petal{position:fixed;top:-35px;pointer-events:none;z-index:2;animation:petalFall linear forwards;opacity:.75}@keyframes petalFall{0%{transform:translate3d(0,-5vh,0) rotate(0deg);opacity:0}10%{opacity:.8}100%{transform:translate3d(var(--sway),110vh,0) rotate(600deg);opacity:0}}
.clickspark{position:fixed;pointer-events:none;z-index:10;animation:clickPop .9s ease-out forwards}@keyframes clickPop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:translateY(-55px) scale(.6)}}
.note{animation:noteReveal 1s .25s both}@keyframes noteReveal{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media(max-width:520px){.card{border-radius:26px}.memory{grid-template-columns:1fr}.memory div{display:flex;align-items:center;gap:12px;text-align:left}.memory span{margin:0}.buttons .btn{width:100%}}
</style></head><body><div id="stars"></div><main><div class="shell"><div class="topline">✦ a tiny website for a very special human ✦</div><section class="card" aria-live="polite"><div id="content"></div><div class="progress" id="progress"></div></section><div class="footer">made with lots of care, just for you ♡</div></div></main>
<script>
for(let i=0;i<100;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*4+'s';s.style.opacity=.15+Math.random()*.7;document.getElementById('stars').appendChild(s)}
const pages=[
{icon:'🌷',tag:'a tiny surprise',title:'Hey, <em>cutie!</em>',text:'I made a little corner of the internet just for you. No birthday, no big occasion, no reason needed… I just felt like reminding you how special you are.',button:'Okay, what is this? ✨'},
{icon:'💗',tag:'a little appreciation',title:'You are ridiculously <em>cute.</em>',text:'I hope somebody tells you this often enough, but you are genuinely such a cute person. The little things about you make you so wonderfully you. Never change that.',button:'Keep going 🌸'},
{icon:'🦋',tag:'a sincere compliment',title:'And honestly… <em>so pretty.</em>',text:'You are one of the prettiest people ever. And I mean more than just how you look — your whole vibe, your expressions, your personality… it all makes you lovely in your own way.',button:'A little more, please 💫'},
{icon:'🌼',tag:'the things I miss',title:'I miss the <em>little things.</em>',text:'Random conversations, silly jokes, sharing tiny updates, laughing about absolutely nothing… those ordinary moments have a way of becoming precious. I miss having more of them with you.',button:'This next bit is true too 💭'},
{icon:'☁️',tag:'a gentle reminder',title:'You make days <em>brighter.</em>',text:'You might not even notice it, but your presence can make a normal day feel a little lighter. I hope you get back the same kindness and happiness that you bring into other people’s days.',button:'One last little page 🌙'},
{icon:'🌙',tag:'even from afar',title:'I still think of <em>you.</em>',text:'Even when we’re busy, even when we don’t talk for a while, you still cross my mind. I hope you’re doing okay, taking care of yourself, and finding reasons to smile.',button:'There is a final note 💌'},
{icon:'💌',tag:'from me, sincerely',title:'My <em>favourite person.</em>',text:'I just wanted you to know that I miss you. You are cute, pretty, funny, and important to me. I’m grateful that you’re part of my life, and I hope today gives you at least one lovely reason to smile.',final:true},
{icon:'🌟',tag:'a little wish for you',title:'Keep being <em>you.</em>',text:'May you have happy days, peaceful nights, people who appreciate you, and all the little things your heart wishes for. And whenever you need a reminder: someone out here thinks you’re pretty awesome.',final:true,extra:true}
];let page=0;
function render(){const p=pages[page];document.getElementById('content').innerHTML=`<div class="badge">${p.tag}</div><div class="hero">${p.icon}</div><h1>${p.title}</h1><p>${p.text}</p>${page===3?'<div class="memory"><div><span>🌻</span>Random little chats</div><div><span>🎀</span>Your silly moments</div><div><span>✨</span>Just being you</div></div>':''}${p.final?'<div class="note"><strong>Never forget this:</strong><br>You deserve kindness, good people, happy moments and every bit of goodness coming your way. I miss you, favourite person. 🌷</div>':''}<div class="buttons">${page<pages.length-1?`<button class="btn" onclick="next()">${p.button}</button>`:`<button class="btn" onclick="sprinkle();this.textContent='A little sparkle just for you ✨'">Send a little sparkle ✨</button><button class="btn ghost" onclick="goodbye()">See you 🌷</button>`}</div>${p.final?'<div class="counter">A little reminder, saved here whenever you need it ♡</div>':''}`;document.getElementById('progress').innerHTML=pages.map((_,i)=>`<span class="dot ${i===page?'on':''}"></span>`).join('')}
function next(){page=Math.min(page+1,pages.length-1);render();if(page===pages.length-1)sprinkle()}function goodbye(){document.body.innerHTML='<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#ffe3ef,transparent 42%),radial-gradient(ellipse at 85% 80%,#e7ddff,transparent 45%),linear-gradient(145deg,#fff6fb,#fff0f7 55%,#f5f0ff);font-family:DM Sans,sans-serif;color:#734d70"><section style="max-width:600px;animation:cardIn .8s both"><div style="font-size:90px;animation:drift 4s infinite">🌷</div><h1 style="font-family:Playfair Display,serif;font-size:clamp(36px,8vw,60px)">See you soon, <em style="color:#d778a6">cutie!</em></h1><p style="line-height:1.9;font-size:18px">Take care of yourself, keep smiling, and don’t forget how wonderfully special you are. ✨</p><p style="font-size:14px">You can close this tab now ♡</p></section></main>';try{window.close()}catch(e){}}function sprinkle(){for(let i=0;i<35;i++){const e=document.createElement('div');e.className='spark';e.textContent=['✨','💗','🌷','💫','🌙','🌸','🎀'][Math.floor(Math.random()*7)];e.style.left=Math.random()*100+'vw';e.style.bottom='-30px';e.style.fontSize=(18+Math.random()*24)+'px';e.style.animationDuration=(2+Math.random()*3)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5500)}}setInterval(()=>{if(Math.random()<.22){const e=document.createElement('div');e.className='spark';e.textContent=['✦','✨','🌷','🌸'][Math.floor(Math.random()*4)];e.style.left=Math.random()*100+'vw';e.style.bottom='-20px';e.style.fontSize='16px';e.style.animationDuration=(5+Math.random()*4)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),9500)}},1400);
// Gentle falling petals, occasional floating sparkles, and click bursts
const petalChars=['🌸','🌷','💮','✿'];
function makePetal(){const el=document.createElement('div');el.className='petal';el.textContent=petalChars[Math.floor(Math.random()*petalChars.length)];el.style.left=Math.random()*100+'vw';el.style.fontSize=(12+Math.random()*15)+'px';el.style.animationDuration=(8+Math.random()*8)+'s';el.style.setProperty('--sway',(Math.random()*180-90)+'px');document.body.appendChild(el);setTimeout(()=>el.remove(),17000)}
setInterval(()=>{if(Math.random()<.65)makePetal()},950);
document.addEventListener('click',e=>{if(e.target.closest('button')){for(let i=0;i<7;i++){const el=document.createElement('span');el.className='clickspark';el.textContent=['✨','💗','🌸','✦'][Math.floor(Math.random()*4)];el.style.left=(e.clientX+(Math.random()*70-35))+'px';el.style.top=(e.clientY+(Math.random()*50-25))+'px';el.style.fontSize=(13+Math.random()*15)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}}});
render();
</script></body></html>
